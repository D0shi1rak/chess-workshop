name: Build Chess Workshop APK

'on':
workflow_dispatch:
push:
branches:
- main
- master

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Download project
uses: actions/checkout@v4

  - name: Install Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Find Android project
    id: project
    shell: bash
    run: |
      if [ -f app/build.gradle ]; then
        echo "dir=." >> "$GITHUB_OUTPUT"
      elif [ -f chess_workshop_android/app/build.gradle ]; then
        echo "dir=chess_workshop_android" >> "$GITHUB_OUTPUT"
      else
        echo "Android project not found"
        exit 1
      fi

  - name: Build APK
    working-directory: ${{ steps.project.outputs.dir }}
    run: gradle assembleDebug

  - name: Save APK
    uses: actions/upload-artifact@v4
    with:
      name: chess-workshop-debug-apk
      path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
